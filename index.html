<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌤️ Weather AI Assistant</h1>
            <p>Ask me about the weather anywhere in the world!</p>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-content">
                        <strong>AI Assistant:</strong> Hello! I can help you check the weather for any location. Select a tool, enter the required locations, and I'll fetch the latest data from the MCP weather server.
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="tool-controls">
                    <label for="toolSelect">
                        <span>Tool</span>
                        <select id="toolSelect">
                            <option value="" disabled selected>Loading tools...</option>
                        </select>
                    </label>
                    <label for="unitSelect">
                        <span>Unit</span>
                        <select id="unitSelect">
                            <option value="celsius">Celsius</option>
                            <option value="fahrenheit">Fahrenheit</option>
                        </select>
                    </label>
                </div>
                <div class="secondary-input hidden" id="location2Wrapper">
                    <input type="text" id="location2Input" placeholder="Second location" autocomplete="off">
                </div>
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Enter a location (e.g. Istanbul, Turkey)" autocomplete="off">
                    <button id="sendButton" class="send-button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22,2 15,22 11,13 2,9 22,2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="examples">
            <h3>Try these examples:</h3>
            <div class="example-buttons">
                <button class="example-btn" data-tool="get_current_weather" data-location="Istanbul, Turkey" data-unit="celsius">Current in Istanbul</button>
                <button class="example-btn" data-tool="get_current_weather" data-location="New York City, USA" data-unit="fahrenheit">Current in NYC (℉)</button>
                <button class="example-btn" data-tool="get_weather_summary" data-location="Tokyo, Japan" data-unit="celsius">Summary for Tokyo</button>
                <button class="example-btn" data-tool="compare_weather" data-location="London, UK" data-location2="Paris, France" data-unit="celsius">Compare London vs Paris</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
